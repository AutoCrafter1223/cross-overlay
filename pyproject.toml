[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "centercross"
version = "0.1.0"
description = "Windows accessibility overlay for motion-sickness and pointer visibility"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7,<7"]

[project.gui-scripts]
centercross = "centercross.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
centercross = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
